<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="100%" height="100%" role="img" aria-label="SIMGPS - Sistem Inventori Manajemen GPS">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Swoosh arc across gps -->
  <path d="M 545 245 C 620 105 830 55 985 90" fill="none" stroke="url(#arcGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="130" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="230" fill="#111a5c" letter-spacing="-6">SIM</text>
  <text x="565" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="230" fill="#f96302" letter-spacing="-6">gps</text>

  <!-- Tagline -->
  <rect x="70" y="330" width="960" height="72" rx="20" fill="#fdeee2" />
  <text x="550" y="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="40" fill="#f96302" text-anchor="middle" letter-spacing="4">SISTEM INVENTORI MANAJEMEN GPS</text>
</svg>
